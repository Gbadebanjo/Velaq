# Local development services. Separate databases per product (AR-0).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
